# Builds and tests the workspace on FreeBSD, inside a FreeBSD VM on a Linux runner
# (GitHub has no FreeBSD runners). GPU tests skip themselves when the VM has no adapter.
name: FreeBSD

on:
  push:
    branches: [release]
  pull_request:
    paths:
      - .github/workflows/freebsd.yml
      - packaging/freebsd/**
      - packaging/env.sh
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freebsd:
    # Pinned to a commit: AsenaCAD is a fork and pins third-party workflows, so upstream changes
    # reach our CI only when we bump the SHA (review the diff first). The workflow's own
    # storytold/craft-common-actions/actions/*@main steps still follow upstream main.
    uses: storytold/craft-common-actions/.github/workflows/freebsd.yml@c6f87c1cc0f119445db687033da6560d5d34c9e1 # reviewed 2026-10-19
    with:
      # x86_64 only: the aarch64 job fails or hangs. aarch64-unknown-freebsd is a tier-3 Rust
      # target with no rustup installer, so it builds with FreeBSD's lang/rust package in an
      # emulated VM. Without this input, pushes and the nightly run build both architectures.
      architectures: '["x86_64"]'
      craft-fonts-ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
