# Builds and tests the workspace on FreeBSD 15 (x86_64), in a FreeBSD VM on a Linux runner
# (GitHub has no FreeBSD runners). Rust is FreeBSD's own package (lang/rust), so the build uses
# the toolchain FreeBSD users get. The UI tests embed craft-fonts as the other CI builds do, find
# DejaVu Sans where FreeBSD's dejavu package puts it, and render with Mesa's software rasterizer
# (a test that needs a GPU adapter skips itself when there is none).
name: FreeBSD

on:
  pull_request:
    paths:
      - .github/workflows/freebsd.yml
      - packaging/freebsd/**
      - crates/**
      - apps/**
      - Cargo.*
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

env:
  # storytold/craft-fonts, the optional font build input (CRAFT_FONTS_DIR, crates/fonts/build.rs).
  CRAFT_FONTS_REF: 3d9ab3a132ed0eff457e424226a435a901da30d3

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
          persist-credentials: false
      - name: cargo test in a FreeBSD VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_INCREMENTAL: "0"
          CARGO_TERM_COLOR: always
        with:
          release: "15"
          arch: x86_64
          mem: 12288
          copyback: false
          envs: CARGO_PROFILE_DEV_DEBUG CARGO_INCREMENTAL CARGO_TERM_COLOR
          prepare: |
            set -eu
            env ASSUME_ALWAYS_YES=yes pkg install -y rust git pkgconf dejavu mesa-libs mesa-dri
          run: |
            set -eu
            freebsd-version
            rustc --version
            cargo --version
            CRAFT_FONTS_DIR="$PWD/craft-fonts" cargo test --workspace --locked
