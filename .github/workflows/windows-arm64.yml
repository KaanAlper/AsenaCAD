# Windows on ARM: package the ARM64 release the way release.yml does (cross-compiled on an x64
# runner, unsigned here), then install that MSI on a Windows 11 ARM64 runner, check the installed
# binaries are ARM64, run the CLI natively, and uninstall.
name: Windows ARM64

on:
  push:
    branches: [release]
  pull_request:
    paths:
      - .github/workflows/windows-arm64.yml
      - packaging/windows/**
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-arm64:
    # Pinned to a commit: AsenaCAD is a fork and pins third-party workflows, so upstream changes
    # reach our CI only when we bump the SHA (review the diff first). The workflow's own
    # storytold/craft-common-actions/actions/*@main steps still follow upstream main.
    uses: storytold/craft-common-actions/.github/workflows/windows-arm64.yml@c6f87c1cc0f119445db687033da6560d5d34c9e1 # reviewed 2026-10-19
    with:
      app-name: asenacad
      app-dir: AsenaCAD
