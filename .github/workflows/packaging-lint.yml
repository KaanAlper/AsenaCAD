# Quick static checks for the release pipeline (seconds, no Rust build): workflow syntax,
# packaging shell/PowerShell scripts, and the Linux desktop/AppStream/Flatpak metadata.
name: Packaging lint

on:
  push:
    branches: [main, release]
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  pull_request:
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Pinned to a commit: AsenaCAD is a fork and pins third-party workflows, so upstream changes
    # reach our CI only when we bump the SHA (review the diff first). The workflow's own
    # storytold/craft-common-actions/actions/*@main steps still follow upstream main.
    uses: storytold/craft-common-actions/.github/workflows/packaging-lint.yml@c6f87c1cc0f119445db687033da6560d5d34c9e1 # reviewed 2026-10-19
